<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寻物有声 · 后端测试</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 32px 20px;
      color: #222;
      background: #f5f5f5;
      font-family: "Microsoft YaHei", sans-serif;
      line-height: 1.7;
    }

    main {
      max-width: 560px;
      margin: 0 auto;
      padding: 28px;
      background: #fff;
      border: 1px solid #ddd;
    }

    h1 { margin-top: 0; font-size: 24px; }
    p { color: #666; font-size: 13px; }

    form { display: grid; gap: 10px; }
    label { margin-top: 8px; font-size: 14px; }

    input {
      width: 100%;
      min-width: 0;
      padding: 12px;
      border: 1px solid #bbb;
      border-radius: 0;
      font: inherit;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    button {
      min-height: 44px;
      padding: 10px 16px;
      color: #fff;
      background: #222;
      border: 0;
      border-radius: 0;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; cursor: wait; }

    pre {
      min-height: 110px;
      padding: 16px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      background: #eee;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <main>
    <h1>注册与登录接口测试</h1>
    <p>使用测试信息。先注册，再登录，最后检查登录状态。</p>

    <form id="auth-test">
      <label for="username">用户名</label>
      <input
        id="username"
        autocomplete="username"
        placeholder="例如 student_b"
        pattern="[A-Za-z0-9_]{3,20}"
        maxlength="20"
        required
      >

      <label for="password">密码</label>
      <input
        id="password"
        type="password"
        autocomplete="off"
        placeholder="8—64 位测试密码"
        minlength="8"
        maxlength="64"
        required
      >

      <div class="actions">
        <button type="submit" value="register">注册</button>
        <button type="submit" value="login">登录</button>
      </div>
    </form>

    <div class="actions">
      <button id="check-user" type="button">查看登录状态</button>
      <button id="logout" type="button">退出登录</button>
    </div>

    <h2>接口返回结果</h2>
    <pre id="result" role="status">等待操作……</pre>
  </main>

  <script>
    const form = document.querySelector("#auth-test");
    const result = document.querySelector("#result");
    const buttons = document.querySelectorAll("button");

    async function request(url, method, body) {
      buttons.forEach(function (button) {
        button.disabled = true;
      });

      result.textContent = "请求中……";

      try {
        const options = {
          method: method,
          credentials: "same-origin"
        };

        if (body) {
          options.headers = {
            "Content-Type": "application/json"
          };
          options.body = JSON.stringify(body);
        }

        const response = await fetch(url, options);
        const data = await response.json();

        result.textContent =
          "HTTP 状态：" + response.status + "\n\n" +
          JSON.stringify(data, null, 2);
      } catch (error) {
        result.textContent =
          "请求失败，请确认后端仍在运行，并通过后端地址打开此页面。";
      } finally {
        buttons.forEach(function (button) {
          button.disabled = false;
        });
      }
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const action = event.submitter
        ? event.submitter.value
        : "login";

      request("/api/auth/" + action, "POST", {
        username: document.querySelector("#username").value,
        password: document.querySelector("#password").value
      });
    });

    document.querySelector("#check-user")
      .addEventListener("click", function () {
        request("/api/auth/me", "GET");
      });

    document.querySelector("#logout")
      .addEventListener("click", function () {
        request("/api/auth/logout", "POST");
      });
  </script>
</body>
</html>
